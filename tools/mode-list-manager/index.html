<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fire Crew 모드 목록 관리자</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><small>FIRE CREW ADMIN</small><h1>모드 목록 관리자</h1></div>
    <div class="header-actions"><button id="keyButton" class="secondary">개인 키 선택</button><button id="saveButton">서명 후 로컬 저장</button></div>
  </header>
  <main>
    <section class="panel summary">
      <label>목록 버전<input id="version" placeholder="fire-crew-26.2-city-building-r3"></label>
      <label>제거할 파일 경로 <span>(한 줄에 하나)</span><textarea id="remove" rows="3"></textarea></label>
    </section>
    <section class="panel">
      <div class="section-title"><div><h2>설치 파일</h2><p>직접 다운로드 URL 또는 Modrinth 프로젝트 페이지 URL을 입력하세요. Minecraft 26.2 / Forge 파일을 자동 선택합니다.</p></div><button id="addButton">+ 모드 추가</button></div>
      <div id="modeList" class="mode-list"></div>
    </section>
    <section class="panel github">
      <div class="section-title"><div><h2>GitHub 게시</h2><p>Contents API로 서명된 JSON만 커밋합니다. OAuth 토큰은 Windows 보안 저장소에 암호화하고 개인 키는 저장하지 않습니다.</p></div></div>
      <div class="auth-box">
        <label>OAuth App Client ID<input id="githubClientId" autocomplete="off" placeholder="GitHub Developer settings의 Client ID"></label>
        <button id="oauthHelpButton" class="secondary">OAuth App 만들기</button>
        <button id="githubLoginButton" class="secondary">GitHub 로그인</button>
        <button id="githubLogoutButton" class="danger" hidden>로그아웃</button>
        <div id="githubAccount">로그인하지 않음 · PAT를 직접 입력해도 됩니다.</div>
      </div>
      <div class="github-grid">
        <label>저장소<input id="repository" value="Delta-A1/HeroRedMinecraftLauncher"></label>
        <label>브랜치<input id="branch" value="main"></label>
        <label>파일 경로<input id="githubPath" value="assets/distribution-manifest.json"></label>
        <label>PAT (로그인하지 않을 때만)<input id="token" type="password" autocomplete="off" placeholder="선택 사항 · Contents: Read and write"></label>
        <label class="wide">커밋 메시지<input id="message" placeholder="Update Fire Crew mode list"></label>
      </div>
      <button id="publishButton" class="publish">서명하고 GitHub에 게시</button>
    </section>
  </main>
  <div id="status" role="status">목록을 불러오는 중...</div>
  <template id="modeTemplate">
    <article class="mode-card">
      <div class="mode-row">
        <label class="path">설치 경로<input data-field="path" placeholder="mods/example.jar"></label>
        <label class="source">표시 이름 / 출처<input data-field="source" placeholder="Example Mod · Modrinth"></label>
        <button data-action="remove" class="danger" title="삭제">삭제</button>
      </div>
      <label>다운로드 URL 또는 Modrinth 페이지<input data-field="url" type="url" placeholder="https://modrinth.com/mod/... 또는 https://cdn..."></label>
      <div class="mode-row details">
        <label>크기 (bytes)<input data-field="size" type="number" min="0"></label>
        <label class="hash">SHA-256 / 기존 해시<input data-field="hash" spellcheck="false"></label>
        <select data-field="algorithm" aria-label="해시 알고리즘"><option>sha256</option><option>sha1</option><option>md5</option></select>
        <button data-action="inspect" class="secondary">자동 확인</button>
      </div>
    </article>
  </template>
  <script src="renderer.js"></script>
</body>
</html>
